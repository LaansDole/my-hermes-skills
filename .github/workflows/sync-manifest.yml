name: sync-skills-manifest

on:
  push:
    paths:
      - "skills/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate skills.json
        run: python3 scripts/generate_docs.py --json

      - name: Commit if changed
        run: |
          if git diff --quiet skills.json; then
            echo "skills.json unchanged"
          else
            git config user.name "LaansDole"
            git config user.email "LaansDole@users.noreply.github.com"
            git add skills.json
            git commit -m "chore(skills): refresh skills.json manifest"
            git push
          fi
