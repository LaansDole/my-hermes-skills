# Example approvals/browser config patch for unattended CDP browser skills
# in this repo (e.g. skills/covidence-screening).
#
# This file is NOT used directly by Hermes. Merge the keys below into
# ~/.hermes/config.yaml -- see each skill's own SETUP.md for exact steps.
#
# Easiest merge: open ~/.hermes/config.yaml in an editor and paste the
# `approvals:` and `browser:` blocks below, preserving any existing keys.
# If Hermes complains about `mode: scoped` on your version, fall back to
# `mode: auto` (only auto-approve scopes you're comfortable running
# unattended).

approvals:
  mode: scoped
  auto_approve:
    - browser.click
    - browser.type
    - browser.fill
    - browser.evaluate
    - browser.screenshot
    - browser.observe

browser:
  # cloud_provider is intentionally UNSET -- we use local CDP only.
  # If a cloud provider was previously set, comment it out:
  # cloud_provider: browserbase   # disabled -- using local CDP
  cloud_provider: local
